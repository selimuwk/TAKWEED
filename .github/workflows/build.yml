
name: Build TAKWEED Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      P4A_RELEASE: "1"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "Cython==0.29.36"

      - name: Initialize Android SDK
        run: |
          buildozer android debug || true

      - name: Accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses
          else
            echo "sdkmanager not found in the expected SDK folders"
            find "$HOME/.buildozer" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-APK
          path: bin/*.apk
          if-no-files-found: error
