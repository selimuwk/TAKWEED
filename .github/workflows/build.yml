
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      P4A_RELEASE: "0"
      ac_cv_func_getgrent: "no"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool \
            pkg-config cmake \
            build-essential \
            libltdl-dev libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Install Android Command-line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          TOOLS="$SDK/cmdline-tools"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"

          mkdir -p "$TOOLS" "$SDK"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -o "$ZIP"

          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" \
            | sha256sum -c -

          rm -rf "$RUNNER_TEMP/android-cli-extract"
          mkdir -p "$RUNNER_TEMP/android-cli-extract"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cli-extract"

          rm -rf "$TOOLS/latest"
          mkdir -p "$TOOLS/latest"
          cp -a "$RUNNER_TEMP/android-cli-extract/cmdline-tools/." "$TOOLS/latest/"

          SDKMANAGER="$TOOLS/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # Compatibility path used by older Buildozer versions.
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          if [ -x "$TOOLS/latest/bin/avdmanager" ]; then
            ln -sf "$TOOLS/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$TOOLS/latest/bin" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # sdkmanager may close the input after processing licenses.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Verify source and configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Commit ====="
          git rev-parse HEAD

          echo "===== Buildozer configuration ====="
          cat buildozer.spec

          echo "===== Verify required settings ====="
          grep -q 'python3==3.13.7' buildozer.spec
          grep -q 'hostpython3==3.13.7' buildozer.spec
          grep -q 'p4a.branch = develop' buildozer.spec

          echo "===== Verify Android SDK ====="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          test -x "$ANDROID_HOME/tools/bin/sdkmanager"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"

          echo "===== Tool versions ====="
          python --version
          java -version
          buildozer --version

      - name: Clean failed Python build
        run: |
          rm -rf \
            .buildozer/android/platform/build-arm64-v8a/build/other_builds/python3

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK successfully created: $APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-Customer-Coding-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
