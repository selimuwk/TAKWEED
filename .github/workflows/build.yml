name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            build-essential \
            libltdl-dev libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Verify source and configuration
        run: |
          echo "===== Commit being built ====="
          git rev-parse HEAD

          echo "===== Workflow file ====="
          cat .github/workflows/build.yml

          echo "===== Buildozer configuration ====="
          cat buildozer.spec

          echo "===== Relevant settings ====="
          grep -nE 'requirements|p4a.branch|android.ndk_api|android.minapi|android.api' buildozer.spec

          echo "===== Search for old Python pins ====="
          grep -RIn '3.12.10' .github buildozer.spec || true

          echo "===== Tool versions ====="
          python --version
          java -version
          buildozer --version

          echo "===== Validate Python versions ====="
          grep -q 'python3==3.14.2' buildozer.spec
          grep -q 'hostpython3==3.14.2' buildozer.spec
          grep -q 'p4a.branch = develop' buildozer.spec

      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
        env:
          P4A_RELEASE: "0"

      - name: Verify APK
        if: success()
        run: |
          find bin -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-Customer-Coding-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
