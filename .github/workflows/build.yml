name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          java -version
          python --version
          buildozer --version

      - name: Validate Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            ls -la
            exit 1
          fi

          echo "Project configuration found."

      - name: Configure Android Build
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          # Pin the Android application's Python version.
          requirements = (
              "python3==3.12.10,kivy,requests,certifi,plyer"
          )

          text, req_count = re.subn(
              r"(?m)^(\s*requirements\s*=\s*).*$",
              lambda m: m.group(1) + requirements,
              text,
              count=1,
          )

          if req_count != 1:
              raise SystemExit(
                  "ERROR: Could not find requirements in buildozer.spec"
              )

          # Explicitly align the NDK API with Android minimum API 24.
          if re.search(r"(?m)^\s*android\.ndk_api\s*=", text):
              text = re.sub(
                  r"(?m)^(\s*android\.ndk_api\s*=\s*).*$",
                  r"\g<1>24",
                  text,
                  count=1,
              )
          else:
              match = re.search(
                  r"(?m)^\s*android\.minapi\s*=.*$",
                  text,
              )

              if not match:
                  raise SystemExit(
                      "ERROR: android.minapi not found in buildozer.spec"
                  )

              text = (
                  text[:match.end()]
                  + "\nandroid.ndk_api = 24"
                  + text[match.end():]
              )

          path.write_text(text, encoding="utf-8")

          print("Updated Android build settings:")
          for line in text.splitlines():
              if re.match(
                  r"^\s*(requirements|android\.api|android\.minapi|"
                  r"android\.ndk_api|p4a\.branch)\s*=",
                  line,
              ):
                  print(line)
          PY

      - name: Preinstall Android SDK Command-line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            TOOLS_ZIP="$RUNNER_TEMP/commandlinetools.zip"
            TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"

            mkdir -p "$TOOLS_DIR"

            curl -fL \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o "$TOOLS_ZIP"

            unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"

            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a "$TOOLS_DIR/cmdline-tools/." \
              "$SDK/cmdline-tools/latest/"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK/tools/bin"

          ln -sfn \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          if [ ! -x "$SDK/build-tools/37.0.0/aidl" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          echo "Android SDK packages installed."

      - name: Fix Legacy SDK Manager Path
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/tools/bin"

          ln -sfn \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo "APK files created:"
          find bin -maxdepth 1 -type f -name "*.apk" \
            -exec ls -lh {} \;

      - name: Upload APK and Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Files
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
