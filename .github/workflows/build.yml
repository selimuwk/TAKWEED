name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      P4A_RELEASE: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Prepare Android Environment
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          python --version

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: Check Project Files
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "buildozer.spec found."
          grep -E '^(title|package.name|package.domain|requirements|android.api|android.minapi|android.ndk|p4a.branch|p4a.bootstrap) *=' buildozer.spec || true

      - name: Initialize Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Buildozer SDK directory: $SDK"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Files
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
