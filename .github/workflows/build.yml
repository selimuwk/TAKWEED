name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK path is not configured."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK path: $SDK"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager was not found at:"
            echo "$SDK/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          sdk_status=${PIPESTATUS[1]}

          echo "sdkmanager exit code: $sdk_status"

          if [ "$sdk_status" -ne 0 ]; then
            echo "Checking license status..."

            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null
            check_status=$?

            if [ "$check_status" -ne 0 ]; then
              echo "ERROR: Android SDK license verification failed."
              exit "$check_status"
            fi
          fi

          echo "License step completed."

      - name: Install Android SDK Packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          python --version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Build APK
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found in the repository root."
            exit 1
          fi

          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7
