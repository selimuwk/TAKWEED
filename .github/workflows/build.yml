name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Prepare Android Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          java -version
          python --version

      - name: Check Project Files
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found in the repository root."
            ls -la
            exit 1
          fi

          echo "buildozer.spec found."

      - name: Buildozer SDK Manager Compatibility
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          echo "Checking Android SDK command-line tools..."

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found in expected locations."
            find "$HOME/.buildozer/android" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$SDK/cmdline-tools/latest/bin"
          mkdir -p "$SDK/tools/bin"

          if [ ! -e "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -s "$CMDLINE" "$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          ln -sfn "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          echo "SDK manager compatibility path configured."
          "$SDK/tools/bin/sdkmanager" --version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK and Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Files
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
