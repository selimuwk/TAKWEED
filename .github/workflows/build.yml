```yaml
name: Build TAKWEED Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          which javac
          java -version
          javac -version

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev \
            cmake ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Verify Project
        run: |
          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec not found"
            exit 1
          }

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAKWEED-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
```
