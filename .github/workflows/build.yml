name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          java -version
          python --version

      - name: Validate Project
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found in repository root."
            ls -la
            exit 1
          fi

          echo "Project configuration found."

      - name: Preinstall Android SDK Command-line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools already exist."
          else
            echo "Installing Android SDK command-line tools..."

            sudo apt-get update
            sudo apt-get install -y curl

            TOOLS_ZIP="$RUNNER_TEMP/commandlinetools.zip"
            TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"

            mkdir -p "$TOOLS_DIR"

            curl -fL \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o "$TOOLS_ZIP"

            unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a "$TOOLS_DIR/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK/tools/bin"
          ln -sfn \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          echo "Checking installed SDK licenses..."
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          if [ ! -x "$SDK/build-tools/37.0.0/aidl" ]; then
            echo "ERROR: AIDL was not installed."
            ls -la "$SDK/build-tools" || true
            exit 1
          fi

          echo "Build Tools 37 and AIDL are available."

      - name: Fix Legacy SDK Manager Path
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/tools/bin"

          ln -sfn \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK and Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Files
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
